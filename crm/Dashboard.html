<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_blank">
<title>Lead CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bone:#f6f4f0;--white:#fff;--sand:#e9e4dc;--stone:#7a746b;--line:#e2ddd5;--ink:#22201d;--ink-2:#4a4640;
  --bronze:#9c7a4f;--ok:#2f6b45;--ok-bg:#e7f1ea;--warn:#8a5a12;--warn-bg:#fbf1dd;--bad:#9b2c2c;--bad-bg:#f8e6e4;
  --sans:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--line)}
.top .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--stone)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;font-weight:600;color:var(--stone);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--bronze)}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--sand);font-size:12px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.danger{color:var(--bad)}
main{padding:16px;max-width:1240px;margin:0 auto}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner p{margin:2px 0}
.groups{display:grid;gap:16px}
.group h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin:6px 0 8px}
.group h2 .n{color:var(--ink)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--ink)}
.card b{font-size:16px}
.card .meta{color:var(--stone);font-size:13.5px;grid-column:1}
.card .when{font-size:13px;font-weight:600;text-align:right}
.when.late{color:var(--bad)}.when.now{color:var(--bronze)}
.empty{color:var(--stone);background:var(--white);border:1px dashed var(--line);border-radius:8px;padding:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--sand);font-size:12px;font-weight:600;color:var(--ink-2)}
.pill.hot{background:var(--bad-bg);color:var(--bad)}.pill.cold{background:#e6ecf2;color:#34506b}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar input,.bar select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--white);min-width:0}
.bar input[type=search]{flex:1 1 220px}
.tablewrap{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--stone);font-weight:600;background:var(--bone)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bone)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sand);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start;min-height:200px}
.col h3{font-size:13px;padding:4px 4px 2px;display:flex;justify-content:space-between}
.col .card{grid-template-columns:1fr;padding:9px 10px}
.col .card b{font-size:14.5px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat span{display:block;color:var(--stone);font-size:13px}.stat b{font-size:26px;font-weight:600}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--white);font-weight:400;font-size:15px;width:100%}
textarea{min-height:90px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.hint{color:var(--stone);font-size:13px;font-weight:400}
.status{border-radius:8px;padding:10px 12px;font-size:14px}
.status.ok{background:var(--ok-bg);color:var(--ok)}.status.no{background:var(--bad-bg);color:var(--bad)}
.status b{display:block}
.status ul{margin:4px 0 0;padding-left:18px}
.warnlist{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0;list-style:none}
/* Lead drawer */
.scrim{position:fixed;inset:0;background:rgba(34,32,29,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bone);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer header{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.drawer header h2{font-size:20px;margin-right:auto;overflow-wrap:anywhere}
.drawer .body{padding:16px;display:grid;gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{border-left:2px solid var(--line);padding:2px 0 2px 12px}
.timeline .t{font-size:12.5px;color:var(--stone)}
.timeline .d{white-space:pre-wrap;overflow-wrap:anywhere}
.modal{background:var(--white);border-radius:10px;width:min(620px,calc(100% - 32px));margin:auto;max-height:calc(100% - 32px);overflow-y:auto;padding:18px;display:grid;gap:12px}
.scrim.center{justify-content:center;align-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--stone)}
details summary{cursor:pointer;font-weight:600}
@media (max-width:720px){.grid2,.form{grid-template-columns:1fr}.card{grid-template-columns:1fr}.card .when{text-align:left}main{padding:12px}}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="brand">Lead CRM<small id="who"></small></div>
    <button type="button" class="btn" id="refresh">Refresh</button>
    <button type="button" class="btn dark" id="add">+ Add lead</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="today" aria-selected="true">Today<span class="n" id="n-today">0</span></button>
    <button role="tab" data-view="leads" aria-selected="false">All leads<span class="n" id="n-all">0</span></button>
    <button role="tab" data-view="pipeline" aria-selected="false">Pipeline</button>
    <button role="tab" data-view="campaigns" aria-selected="false">Email campaigns</button>
    <button role="tab" data-view="reports" aria-selected="false">Results</button>
    <button role="tab" data-view="rules" aria-selected="false">Contact rules</button>
  </nav>
</div>
<main id="main"><div class="loading">Loading your leads…</div></main>

<script>
const S = { data: null, view: "today", filters: { q: "", stage: "", goal: "", source: "" } };
const $ = s => document.querySelector(s);
const GOAL_LABEL = { buy: "Buy", sell: "Sell", invest: "Invest", rent: "Rent", other: "Other" };

// ---------- Server calls ----------
function call(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e)))).api(action, payload || {});
  });
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
async function load() {
  try {
    S.data = await call("bootstrap");
    $("#who").textContent = S.data.settings.agentName + " · " + S.data.settings.brokerage;
    render();
  } catch (e) { $("#main").replaceChildren(h("div", { class: "empty" }, "Could not load: " + e.message)); }
}
function upsert(lead) {
  const i = S.data.leads.findIndex(l => l.id === lead.id);
  if (i >= 0) S.data.leads[i] = lead; else S.data.leads.push(lead);
}

// ---------- Tiny element builder (always uses text, never raw HTML, because lead data comes from the public) ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat(9).forEach(c => { if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c)); });
  return el;
}

// ---------- Dates ----------
const dayKey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const todayKey = () => dayKey(new Date());
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: new Date(iso).getFullYear() === new Date().getFullYear() ? undefined : "numeric" }) : "—"; }
function fmtWhen(iso) { return iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return m + " min ago"; if (m < 1440) return Math.round(m / 60) + " h ago"; return Math.round(m / 1440) + " days ago";
}
function dueLabel(iso) {
  if (!iso) return { text: "No follow-up", cls: "" };
  const days = Math.round((new Date(dayKey(iso)) - new Date(todayKey())) / 864e5);
  if (days < 0) return { text: -days + (days === -1 ? " day" : " days") + " overdue", cls: "late" };
  if (days === 0) return { text: "Due today", cls: "now" };
  if (days === 1) return { text: "Tomorrow", cls: "" };
  return { text: "In " + days + " days", cls: "" };
}
const toInputDate = iso => iso ? dayKey(iso) : "";
const fromInputDate = v => v ? new Date(v + "T09:00:00").toISOString() : "";

// ---------- Lists ----------
const active = l => l.stage !== "Lost";
function todayGroups() {
  const leads = S.data.leads.filter(active), t = todayKey(), week = dayKey(Date.now() + 7 * 864e5);
  const fresh = leads.filter(l => l.stage === "New" && !(Number(l.attempts) > 0)).sort((a, b) => new Date(b.created) - new Date(a.created));
  const rest = leads.filter(l => !fresh.includes(l) && l.nextFollowUp);
  const by = (a, b) => new Date(a.nextFollowUp) - new Date(b.nextFollowUp);
  return {
    fresh,
    overdue: rest.filter(l => dayKey(l.nextFollowUp) < t).sort(by),
    today: rest.filter(l => dayKey(l.nextFollowUp) === t).sort(by),
    soon: rest.filter(l => dayKey(l.nextFollowUp) > t && dayKey(l.nextFollowUp) <= week).sort(by)
  };
}
function leadCard(l, mode) {
  const due = mode === "fresh" ? { text: "Came in " + ago(l.created), cls: "now" } : dueLabel(l.nextFollowUp);
  const temp = l.temperature ? h("span", { class: "pill " + String(l.temperature).toLowerCase() }, l.temperature) : null;
  return h("button", { type: "button", class: "card", onclick: () => openLead(l.id) },
    h("div", null, h("b", null, l.name || "(no name)"), " ", temp),
    h("div", { class: "when " + due.cls }, due.text),
    h("div", { class: "meta" }, [GOAL_LABEL[l.goal] || "", l.area, l.source, l.stage, l.language === "es" ? "Español" : ""].filter(Boolean).join(" · ")));
}

// ---------- Views ----------
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view)));
  const g = todayGroups();
  $("#n-today").textContent = g.fresh.length + g.overdue.length + g.today.length;
  $("#n-all").textContent = S.data.leads.length;
  const banner = S.data.warnings.length ? h("div", { class: "banner" }, S.data.warnings.map(w => h("p", null, "⚠ " + w))) : null;
  const view = { today: viewToday, leads: viewLeads, pipeline: viewPipeline, campaigns: viewCampaigns, reports: viewReports, rules: viewRules }[S.view]();
  $("#main").replaceChildren(...[banner, view].filter(Boolean));
}

function viewToday() {
  const g = todayGroups();
  const block = (title, list, mode, emptyText) => h("section", { class: "group" },
    h("h2", null, title, " ", h("span", { class: "n" }, "(" + list.length + ")")),
    list.length ? h("div", { class: "cards" }, list.map(l => leadCard(l, mode))) : h("div", { class: "empty" }, emptyText));
  return h("div", { class: "groups" },
    block("New leads: reach out now", g.fresh, "fresh", "No new leads waiting. Nice work."),
    block("Overdue", g.overdue, "", "Nothing overdue."),
    block("Due today", g.today, "", "Nothing else due today."),
    block("Coming up this week", g.soon, "", "Nothing scheduled this week."));
}

function filteredLeads() {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return S.data.leads.filter(l =>
    (!f.stage || l.stage === f.stage) && (!f.goal || l.goal === f.goal) && (!f.source || l.source === f.source) &&
    (!q || [l.name, l.email, l.phone, l.area, l.tags, l.notes].join(" ").toLowerCase().includes(q))
  ).sort((a, b) => new Date(b.created) - new Date(a.created));
}
function select(name, options, value, blank, onchange) {
  return h("select", { "aria-label": name, onchange },
    blank !== undefined ? h("option", { value: "" }, blank) : null,
    options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; const opt = h("option", { value: v }, t); if (v === value) opt.selected = true; return opt; }));
}
function viewLeads() {
  const L = S.data.lists, f = S.filters;
  const body = h("tbody");
  const fill = () => {
    const rows = filteredLeads();
    body.replaceChildren(...rows.map(l => h("tr", { onclick: () => openLead(l.id), tabindex: "0", onkeydown: e => { if (e.key === "Enter") openLead(l.id); } },
      h("td", null, h("b", null, l.name), h("div", { class: "hint" }, [l.phone, l.email].filter(Boolean).join(" · "))),
      h("td", null, l.stage), h("td", null, GOAL_LABEL[l.goal] || ""), h("td", null, l.area || ""), h("td", null, l.source || ""),
      h("td", null, h("span", { class: "when " + dueLabel(l.nextFollowUp).cls }, l.nextFollowUp ? fmtDate(l.nextFollowUp) : "—")),
      h("td", null, fmtDate(l.lastContact)))));
    if (!rows.length) body.append(h("tr", null, h("td", { colspan: "7", class: "hint" }, S.data.leads.length ? "No leads match." : "No leads yet. They appear here as soon as someone uses your website form, or add one with + Add lead.")));
  };
  const set = k => e => { f[k] = e.target.value; fill(); };
  const bar = h("div", { class: "bar" },
    h("input", { type: "search", placeholder: "Search name, phone, email, area, tags…", value: f.q, oninput: set("q"), "aria-label": "Search" }),
    select("Stage", L.stages, f.stage, "All stages", set("stage")),
    select("Goal", L.goals.map(g => [g, GOAL_LABEL[g]]), f.goal, "All goals", set("goal")),
    select("Source", L.sources, f.source, "All sources", set("source")),
    h("a", { class: "btn", href: S.data.sheetUrl }, "Open the sheet"));
  fill();
  return h("div", null, bar, h("div", { class: "tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, ["Name", "Stage", "Goal", "Area", "Source", "Next follow-up", "Last contact"].map(t => h("th", null, t)))), body)));
}

function viewPipeline() {
  return h("div", { class: "board" }, S.data.lists.stages.map(st => {
    const list = S.data.leads.filter(l => l.stage === st).sort((a, b) => new Date(a.nextFollowUp || 8e15) - new Date(b.nextFollowUp || 8e15));
    return h("section", { class: "col", "aria-label": st }, h("h3", null, st, h("span", null, list.length)), list.map(l => leadCard(l)));
  }));
}

function viewCampaigns() {
  const L = S.data.lists, emailT = S.data.templates.filter(t => t.channel === "email" && t.key !== "welcome");
  const keys = [...new Map(emailT.map(t => [t.key, t])).values()];
  const st = { key: keys[0] ? keys[0].key : "", filter: { stage: "", goal: "", language: "", source: "", tag: "" } };
  const out = h("div", { class: "panel" }, h("p", { class: "hint" }, "Pick a template and a group, then preview who will get it."));
  const preview = async () => {
    out.replaceChildren(h("p", { class: "hint" }, "Checking permissions…"));
    try {
      const r = await call("campaignPreview", st);
      const skipped = Object.entries(r.skipped);
      out.replaceChildren(
        h("div", { class: "stats" }, h("div", { class: "stat" }, h("span", null, "Will receive it"), h("b", null, r.eligible)),
          h("div", { class: "stat" }, h("span", null, "Left out"), h("b", null, skipped.reduce((n, [, c]) => n + c, 0))),
          h("div", { class: "stat" }, h("span", null, "Emails left today (Google limit)"), h("b", null, r.quota))),
        r.names.length ? h("p", { class: "hint" }, "Includes " + r.names.join(", ") + (r.eligible > r.names.length ? " and " + (r.eligible - r.names.length) + " more." : ".")) : null,
        skipped.length ? h("ul", { class: "warnlist" }, skipped.map(([why, n]) => h("li", null, n + " left out: " + why))) : null,
        r.blocker ? h("div", { class: "status no" }, r.blocker) : null,
        r.eligible > r.quota ? h("p", { class: "hint" }, "Only " + r.quota + " can go out today. Send again tomorrow for the rest. People who already got it today will get it again, so narrow the group by tag if needed.") : null,
        h("div", { class: "actions" }, h("button", { type: "button", class: "btn dark", disabled: !!r.blocker || !r.eligible || !r.quota, onclick: send }, "Send to " + Math.min(r.eligible, r.quota) + " people")));
    } catch (e) { out.replaceChildren(h("div", { class: "status no" }, e.message)); }
  };
  const send = async () => {
    if (!confirm("Send this email now? Each person gets their own copy, in their language, with your address and an unsubscribe link.")) return;
    out.replaceChildren(h("p", { class: "hint" }, "Sending… keep this window open."));
    try {
      const r = await call("campaignSend", st);
      out.replaceChildren(h("div", { class: "status ok" }, h("b", null, "Sent " + r.sent + " emails."), r.left > 0 ? r.left + " still waiting for tomorrow's limit." : "", r.failed ? " " + r.failed + " could not be sent." : ""));
      S.data = await call("bootstrap");
    } catch (e) { out.replaceChildren(h("div", { class: "status no" }, e.message)); }
  };
  const tplPreview = h("div", { class: "hint", style: "white-space:pre-wrap" });
  const showTpl = () => { const t = emailT.find(x => x.key === st.key && x.language === "en") || emailT.find(x => x.key === st.key); tplPreview.textContent = t ? "Subject: " + t.subject + "\n\n" + t.body : ""; };
  showTpl();
  const set = k => e => { st.filter[k] = e.target.value; };
  return h("div", { class: "grid2" },
    h("div", { class: "panel" },
      h("h3", null, "Send an email to a group"),
      h("label", { class: "f" }, "Template", select("Template", keys.map(t => [t.key, t.name + (t.kind === "marketing" ? " (marketing)" : "")]), st.key, undefined, e => { st.key = e.target.value; showTpl(); })),
      h("div", { class: "form" },
        h("label", { class: "f" }, "Stage", select("Stage", L.stages, "", "Any", set("stage"))),
        h("label", { class: "f" }, "Goal", select("Goal", L.goals.map(g => [g, GOAL_LABEL[g]]), "", "Any", set("goal"))),
        h("label", { class: "f" }, "Language", select("Language", [["en", "English"], ["es", "Español"]], "", "Any", set("language"))),
        h("label", { class: "f" }, "Source", select("Source", L.sources, "", "Any", set("source"))),
        h("label", { class: "f full" }, "Tag (optional)", h("input", { placeholder: "e.g. summerlin-buyers", oninput: set("tag") }))),
      h("div", { class: "actions" }, h("button", { type: "button", class: "btn dark", onclick: preview }, "Preview who gets it")),
      h("details", null, h("summary", null, "See the template"), tplPreview),

  const L = S.data.lists, F = {};
  const inp = (k, label, attrs) => h("label", { class: "f" + (attrs && attrs.full ? " full" : "") }, label, F[k] = h("input", Object.assign({}, attrs, { full: null })));
  F.source = select("Source", L.sources, "Open house"); F.goal = select("Goal", L.goals.map(g => [g, GOAL_LABEL[g]]), "buy"); F.language = select("Language", [["en", "English"], ["es", "Español"]], "en");
  F.inquired = h("input", { type: "checkbox", checked: true }); F.em = h("input", { type: "checkbox" }); F.ph = h("input", { type: "checkbox" }); F.hasAgent = h("input", { type: "checkbox" });
  const err = h("p", { class: "status no", hidden: true });
  const m = modal("Add a lead",
    h("div", { class: "form" }, inp("name", "Name"), inp("phone", "Phone", { type: "tel" }), inp("email", "Email", { type: "email", full: true }),
      h("label", { class: "f" }, "Source", F.source), h("label", { class: "f" }, "Goal", F.goal), h("label", { class: "f" }, "Language", F.language), inp("area", "Area"),
      inp("referredBy", "Referred by"), inp("tags", "Tags"), h("label", { class: "f full" }, "Notes", F.notes = h("textarea", null))),
    h("label", { class: "check" }, F.inquired, h("span", null, "They contacted me or asked me about real estate ", h("span", { class: "hint" }, "(lets you follow up for 3 months)"))),
    h("label", { class: "check" }, F.hasAgent, "They already work with another agent"),
    h("label", { class: "check" }, F.em, "They agreed to receive my emails"),
    h("label", { class: "check" }, F.ph, h("span", null, "They signed written consent to calls and texts ", h("span", { class: "hint" }, "(only if they signed it)"))),
    inp("proof", "If they gave permission: where and how", { full: true, placeholder: "e.g. Open house sign-in sheet, 123 Main St" }),
    err,
    h("div", { class: "actions" }, h("button", { type: "button", class: "btn dark", onclick: async () => {
      const p = { inquired: F.inquired.checked, hasAgent: F.hasAgent.checked, addEmailConsent: F.em.checked, addPhoneConsent: F.ph.checked, consentProof: F.proof.value };
      ["name", "phone", "email", "source", "goal", "language", "area", "referredBy", "tags", "notes"].forEach(k => p[k] = F[k].value);
      try { const r = await call("saveLead", p); upsert(r.lead); m.remove(); toast("Lead added"); render(); openLead(r.lead.id); }
      catch (e) { err.textContent = e.message; err.hidden = false; }
    } }, "Add lead"), h("button", { type: "button", class: "btn", onclick: () => m.remove() }, "Cancel")));
  F.name.focus();
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; render(); }));
$("#refresh").addEventListener("click", () => { $("#main").replaceChildren(h("div", { class: "loading" }, "Refreshing…")); load(); });
$("#add").addEventListener("click", addLead);
load();
</script>
</body>
</html>
